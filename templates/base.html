{% load static %}
{% load crispy_forms_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href= {% static 'css/style.css' %}>
    <link rel="stylesheet" href= {% static 'css/bootstrap.min.css' %}>
    <title>{% block title%}{%endblock%}</title>
   
</head>

<body>
  <div class="d-flex justify-content-between px-4">
<a href= {%url 'index_page' %}><button class='btn btn-success' >Back to Home</button></a>
<form class='d-flex justify-content-end ' action= {%url 'logout' %} method="POST">
  {% csrf_token %}
  <button class='btn btn-danger' >Log Out</button>
</form>

  </div>

   <h2>{% block details%}{%endblock%}</h2>
     {% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
  {% endfor %}
{% endif %}
<form method="post">
    {% csrf_token %}
    {{form | crispy}}
    <button type="submit" class="btn btn-primary">{% block submitbutton %}{% endblock %}</button>
</form>

{% block content%}{%endblock%}
<script src={% static 'js/main.js'%}> </script>
</body>
</html>
